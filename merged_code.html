<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #333;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>Algorithm Menu</h2>
    <div>
        <button onclick="runKruskal()">1. Resource Distribution Cost Minimization (Kruskal's)</button>
        <button onclick="runDijkstra()">2. Optimal Evacuation Routing (Dijkstra's)</button>
        <button onclick="runHeapSort()">3. High-Risk Zone Prioritization (Heap Sort)</button>
        <button onclick="exitProgram()">4. Exit</button>
    </div>

    <h3>Result:</h3>
    <pre id="result"></pre>

    <script>
        // Kruskal's Algorithm Implementation
        function runKruskal() {
            const edges = [
                {src: 0, dest: 1, weight: 4},
                {src: 1, dest: 2, weight: 1},
                {src: 0, dest: 2, weight: 3},
                {src: 2, dest: 3, weight: 2},
                {src: 1, dest: 3, weight: 5}
            ];
            
            let parent = [], rank = [], mstEdges = [];
            let mstCost = 0;
            let n = 4;

            function find(u) {
                if (parent[u] !== u) {
                    parent[u] = find(parent[u]);
                }
                return parent[u];
            }

            function union(u, v) {
                let rootU = find(u), rootV = find(v);
                if (rootU !== rootV) {
                    if (rank[rootU] < rank[rootV]) {
                        parent[rootU] = rootV;
                    } else if (rank[rootU] > rank[rootV]) {
                        parent[rootV] = rootU;
                    } else {
                        parent[rootV] = rootU;
                        rank[rootU]++;
                    }
                }
            }

            for (let i = 0; i < n; i++) {
                parent[i] = i;
                rank[i] = 0;
            }

            edges.sort((a, b) => a.weight - b.weight);

            for (let edge of edges) {
                let rootSrc = find(edge.src);
                let rootDest = find(edge.dest);
                if (rootSrc !== rootDest) {
                    mstCost += edge.weight;
                    mstEdges.push(edge);
                    union(rootSrc, rootDest);
                }
            }

            let result = "Edges in the MST:\n";
            for (let edge of mstEdges) {
                result += `${edge.src} -- ${edge.dest} == ${edge.weight}\n`;
            }
            result += `Total cost of MST: ${mstCost}`;
            document.getElementById("result").textContent = result;
        }

        // Dijkstra's Algorithm Implementation
        function runDijkstra() {
            const graph = [
                [[2, 1], [4, 2]],
                [[1, 2], [7, 3]],
                [[3, 3], [1, 4]],
                [[2, 5]],
                [[5, 5]]
            ];
            const n = 6;
            const dist = Array(n).fill(Infinity);
            const pq = [];

            dist[0] = 0;
            pq.push([0, 0]);

            while (pq.length > 0) {
                pq.sort((a, b) => a[0] - b[0]);
                const [d, u] = pq.shift();

                if (d > dist[u]) continue;

                for (let [weight, v] of graph[u]) {
                    if (dist[u] + weight < dist[v]) {
                        dist[v] = dist[u] + weight;
                        pq.push([dist[v], v]);
                    }
                }
            }

            let result = "Shortest distances from node 0:\n";
            for (let i = 0; i < n; i++) {
                result += `To node ${i}: ${dist[i] === Infinity ? -1 : dist[i]}\n`;
            }
            document.getElementById("result").textContent = result;
        }

        // Heap Sort Implementation
        function runHeapSort() {
            const tasks = [
                [1, 34],
                [2, 0],
                [3, 45],
                [4, 6],
                [5, 5]
            ];

            function heapify(arr, n, i) {
                let largest = i;
                let left = 2 * i + 1;
                let right = 2 * i + 2;

                if (left < n && arr[left][1] > arr[largest][1]) {
                    largest = left;
                }

                if (right < n && arr[right][1] > arr[largest][1]) {
                    largest = right;
                }

                if (largest !== i) {
                    [arr[i], arr[largest]] = [arr[largest], arr[i]];
                    heapify(arr, n, largest);
                }
            }

            function heapSort(arr) {
                const n = arr.length;

                for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
                    heapify(arr, n, i);
                }

                for (let i = n - 1; i >= 0; i--) {
                    [arr[0], arr[i]] = [arr[i], arr[0]];
                    heapify(arr, i, 0);
                }
            }

            heapSort(tasks);

            let result = "After sorting (by priority):\n";
            for (let task of tasks) {
                result += `Task: ${task[0]}, Priority: ${task[1]}\n`;
            }
            document.getElementById("result").textContent = result;
        }

        // Exit Program
        function exitProgram() {
            document.getElementById("result").textContent = "Exiting program...";
        }
    </script>

</body>
</html>
